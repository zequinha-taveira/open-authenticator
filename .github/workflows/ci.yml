name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --all
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=python pytest -q
